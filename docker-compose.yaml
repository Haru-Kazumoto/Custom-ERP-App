services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sales-application-app
        restart: unless-stopped

        volumes:
            - .:/app
            - ./docker/Caddyfile:/etc/caddy/Caddyfile

        ports:
            - "8000:80"

        depends_on:
            db:
                condition: service_healthy

        environment:
            APP_ENV: local
            APP_DEBUG: "true"

            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: sales_app_db
            DB_USERNAME: root
            DB_PASSWORD: root

        networks:
            - app-network

    node:
        image: node:22-alpine
        container_name: sales-application-node
        working_dir: /app

        volumes:
            - .:/app
            - node_modules:/app/node_modules

        ports:
            - "5173:5173"

        command: npm run dev -- --host 0.0.0.0

        networks:
            - app-network

    db:
        image: mysql:8.4
        container_name: sales-application-db
        restart: unless-stopped

        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: sales_app_db

        ports:
            - "3306:3306"

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10

        networks:
            - app-network

volumes:
    mysql_data:
    node_modules:

networks:
    app-network:
        driver: bridge
